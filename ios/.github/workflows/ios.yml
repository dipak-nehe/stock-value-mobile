name: ios

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the Xcode and simulators available
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Generate the Xcode project (XcodeGen, from project.yml)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[-1].split("-")], reverse=True)
          for runtime in ios:
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and run the unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project StockValue.xcodeproj -scheme StockValue \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: .*StockValue|Test Case|Executed|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      # Proof it runs: install the app on the simulator, open it, and screenshot the live site inside it.
      - name: Launch the app and take screenshots
        if: success()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/StockValue.app" -maxdepth 6 | head -1)
          echo "app: $APP"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          xcrun simctl launch "$UDID" com.dipaknehe.stockvalue
          sleep 20
          xcrun simctl io "$UDID" screenshot screenshots/1-start-page.png
          xcrun simctl terminate "$UDID" com.dipaknehe.stockvalue
          xcrun simctl launch "$UDID" com.dipaknehe.stockvalue -OpenURL "https://stock-value-analysis.vercel.app/?t=KO"
          sleep 25
          xcrun simctl io "$UDID" screenshot screenshots/2-ko-results.png
          xcrun simctl terminate "$UDID" com.dipaknehe.stockvalue
          xcrun simctl launch "$UDID" com.dipaknehe.stockvalue -AppleLanguages "(es)" -OpenURL "https://stock-value-analysis.vercel.app/?t=KO&lang=es"
          sleep 25
          xcrun simctl io "$UDID" screenshot screenshots/3-spanish.png

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
