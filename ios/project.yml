# XcodeGen project definition: `xcodegen generate` writes StockValue.xcodeproj (not committed).
name: StockValue
options:
  bundleIdPrefix: com.dipaknehe
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  StockValue:
    type: application
    platform: iOS
    sources:
      - StockValue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dipaknehe.stockvalue
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StockValue/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StockValue/Info.plist
      properties:
        CFBundleDisplayName: Stock Value
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The web app this shell wraps (tests override it with the -SiteURL launch argument in debug builds).
        SiteURL: https://stock-value-analysis.vercel.app/
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Background filing checks (BGAppRefreshTask).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.dipaknehe.stockvalue.filing-check]
        # HTTPS only, except the local test server (http://localhost) used by the end-to-end tests.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StockValueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StockValueTests
    dependencies:
      - target: StockValue
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dipaknehe.stockvalue.tests
schemes:
  StockValue:
    build:
      targets:
        StockValue: all
        StockValueTests: [test]
    test:
      targets:
        - StockValueTests
      gatherCoverageData: true
