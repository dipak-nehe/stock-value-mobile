name: android

on:
  push:
  pull_request:

jobs:
  build:
    name: Unit tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stock-value-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the Android emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # On failure, keep the emulator's system log (app crashes and the app's own log lines) for the report.
          script: ./gradlew connectedDebugAndroidTest || { adb logcat -d > app/build/reports/logcat.txt; exit 1; }

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/logcat.txt
          if-no-files-found: ignore

  appium:
    name: Appium end-to-end (WebdriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      broken: ${{ steps.counts.outputs.broken }}
      total: ${{ steps.counts.outputs.total }}
      report_url: ${{ steps.publish.outputs.run_url }}
      latest_report_url: ${{ steps.publish.outputs.url }}
    env:
      # Optional: publishes the Allure report to its own Vercel site (the email links to it).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # The emulator needs ~7.4 GB for its data partition; with Gradle and node_modules the runner falls just short.
      # Remove preinstalled toolchains this job never uses (.NET, Haskell, CodeQL, Boost).
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      - name: Install WebdriverIO, Appium and the UiAutomator2 driver
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npm run appium:drivers

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the mock and live suites on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          # Warm-up: a freshly booted emulator is busy (Google Play services updating), and the first spec used to
          # fail its first attempt. Install and open the app once, then let the device settle before testing.
          # On failure, keep the device log (the app logs each page it loads in debug builds).
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell am start -W -n com.dipaknehe.stockvalue/.MainActivity && sleep 45 && adb shell am force-stop com.dipaknehe.stockvalue
            cd e2e && npm test || { adb logcat -d > logs/logcat.txt; exit 1; }

      - name: Build the Allure report
        if: always()
        working-directory: e2e
        run: npm run report

      - name: Count the results
        id: counts
        if: always()
        run: python3 .github/scripts/allure_counts.py e2e/allure-results

      - name: Publish the Allure report to Vercel
        id: publish
        if: always() && env.VERCEL_TOKEN != '' && hashFiles('e2e/allure-report/index.html') != ''
        run: python3 .github/scripts/publish_report.py e2e/allure-report/index.html

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-allure-report
          path: e2e/allure-report/
          if-no-files-found: ignore

      - name: Upload the Appium and WebdriverIO logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-logs
          path: e2e/logs/
          if-no-files-found: ignore

  # Emails a summary with a link to the Allure report: on every push to main, and on any failed run.
  # Needs secrets SMTP_USERNAME / SMTP_PASSWORD (a Gmail address and an app password) and the REPORT_EMAIL variable;
  # without them the step is skipped with a note.
  notify:
    name: Email the test report
    needs: [build, emulator, appium]
    if: always() && (github.ref == 'refs/heads/main' || contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
      OUTCOME: ${{ contains(needs.*.result, 'failure') && 'FAILED' || contains(needs.*.result, 'cancelled') && 'CANCELLED' || 'PASSED' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Explain a skipped email
        if: env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' || env.REPORT_EMAIL == ''
        run: echo "::notice title=Report email skipped::Set the SMTP_USERNAME and SMTP_PASSWORD secrets and the REPORT_EMAIL variable to receive report emails."

      - name: Send the email
        if: env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.REPORT_EMAIL != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Stock Value Android CI <${{ secrets.SMTP_USERNAME }}>
          to: ${{ vars.REPORT_EMAIL }}
          subject: "[${{ env.OUTCOME }}] Stock Value Android tests: ${{ needs.appium.outputs.passed || '?' }}/${{ needs.appium.outputs.total || '?' }} e2e passed (${{ github.ref_name }} ${{ github.sha }})"
          html_body: |
            <h2 style="margin:0 0 8px">Stock Value Android: ${{ env.OUTCOME }}</h2>
            <p style="margin:0 0 12px;color:#555">${{ github.event.head_commit.message || github.event.pull_request.title }}<br>
              <code>${{ github.ref_name }}</code> · <code>${{ github.sha }}</code> · by ${{ github.actor }}</p>
            <table cellpadding="6" style="border-collapse:collapse;border:1px solid #ddd">
              <tr><td>Unit tests, lint, APK</td><td><b>${{ needs.build.result }}</b></td></tr>
              <tr><td>Espresso emulator tests</td><td><b>${{ needs.emulator.result }}</b></td></tr>
              <tr><td>Appium end-to-end</td><td><b>${{ needs.appium.result }}</b>:
                ${{ needs.appium.outputs.passed || 0 }} passed, ${{ needs.appium.outputs.failed || 0 }} failed,
                ${{ needs.appium.outputs.broken || 0 }} broken, of ${{ needs.appium.outputs.total || 0 }}</td></tr>
            </table>
            <p style="margin:16px 0 4px"><a href="${{ needs.appium.outputs.report_url || env.RUN_URL }}"
              style="background:#2166b8;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none">Open the Allure report</a></p>
            <p style="margin:12px 0 0;color:#555">GitHub run (logs, APK and report downloads): <a href="${{ env.RUN_URL }}">${{ env.RUN_URL }}</a>
              ${{ needs.appium.outputs.latest_report_url && format('<br>Latest report, always: <a href="{0}">{0}</a>', needs.appium.outputs.latest_report_url) || '' }}</p>
