name: android

on:
  push:
  pull_request:

jobs:
  build:
    name: Unit tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stock-value-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the Android emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # On failure, keep the emulator's system log (app crashes and the app's own log lines) for the report.
          script: ./gradlew connectedDebugAndroidTest || { adb logcat -d > app/build/reports/logcat.txt; exit 1; }

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/logcat.txt
          if-no-files-found: ignore
